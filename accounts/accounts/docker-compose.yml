services:
  accounts:
    image: "chandrabhushan1/accounts"
    container_name: account-microservice
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - chandrabhushan1

  loans:
    image: "chandrabhushan1/loans"
    container_name: loans-microservice
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - chandrabhushan1
  cards:
    image: "chandrabhushan1/cards"
    container_name: cards-microservice
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - chandrabhushan1
networks:
  chandrabhushan1:
    driver: "bridge"